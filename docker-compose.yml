services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G  # Aumentado para evitar OOM durante processamentos pesados
        reservations:
          memory: 128M
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude "*.pyc" --reload-exclude "*.tmp" --reload-exclude "__pycache__"
    restart: always

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: trm_analytics_frontend
    ports:
      - "80:80"
    restart: always